<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="示例机动车行驶证">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset="0.55" stop-color="#fdfbf0"/>
      <stop offset="1" stop-color="#f7f4e6"/>
    </linearGradient>
    <pattern id="guilloche" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 9 Q4.5 3 9 9 T18 9" fill="none" stroke="#0f6b57" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="micro" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#c2410c" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1000" height="640" fill="#e7eae4"/>
  <rect x="44" y="44" width="912" height="552" rx="10" fill="url(#paper)" stroke="#cfd6cf" stroke-width="2"/>
  <rect x="60" y="60" width="880" height="520" rx="6" fill="url(#guilloche)" stroke="#0f6b57" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="66" y="66" width="868" height="508" rx="4" fill="url(#micro)"/>

  <text x="500" y="126" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="34" font-weight="700" fill="#8f1d18" letter-spacing="6">中华人民共和国机动车行驶证</text>
  <text x="500" y="152" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="11" fill="#5c6663" letter-spacing="5">MOTOR VEHICLE DRIVING LICENSE · SAMPLE</text>
  <line x1="110" y1="170" x2="890" y2="170" stroke="#8f1d18" stroke-opacity="0.35" stroke-width="1"/>

