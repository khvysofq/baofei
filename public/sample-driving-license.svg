      <line x1="110" y1="322" x2="500" y2="322"/>
      <line x1="110" y1="372" x2="500" y2="372"/>
      <line x1="110" y1="422" x2="500" y2="422"/>
      <line x1="110" y1="472" x2="500" y2="472"/>
      <line x1="110" y1="522" x2="500" y2="522"/>
      <line x1="540" y1="222" x2="890" y2="222"/>
      <line x1="540" y1="272" x2="890" y2="272"/>
      <line x1="540" y1="322" x2="890" y2="322"/>
      <line x1="540" y1="372" x2="890" y2="372"/>
      <line x1="540" y1="422" x2="890" y2="422"/>
      <line x1="540" y1="472" x2="890" y2="472"/>
