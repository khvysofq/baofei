    <circle r="52" fill="none" stroke="#8f1d18" stroke-opacity="0.4" stroke-width="1"/>
    <text y="-8" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#8f1d18" fill-opacity="0.62">产品演示</text>
