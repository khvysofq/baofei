      <text x="196" y="458">大众牌 FV7160</text>
      <text x="196" y="508" font-family="'Geist Mono',monospace" font-size="15">LSVAA49J1C2****18</text>
      <text x="196" y="552" font-family="'Geist Mono',monospace" font-size="15">CDF****736</text>

